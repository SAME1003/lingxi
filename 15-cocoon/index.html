<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三幕 · 渗入 — 推荐茧房</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A0D11'/><rect x='7' y='8' width='18' height='4' rx='2' fill='%238FD8BE'/><rect x='7' y='14' width='18' height='4' rx='2' fill='%238FD8BE'/><rect x='7' y='20' width='10' height='4' rx='2' fill='%23B14A3F'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --red-pen:#B14A3F;--term:#8FD8BE;--seal:#1E6B5F;--teal:#14524B;
  --serif:"Noto Serif SC",Songti SC,SimSun,serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--kai:KaiTi,STKaiti,"楷体",var(--serif);--mono:"IBM Plex Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07090c;color:#E8EAE6;font-family:var(--sans);user-select:none}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:42px 10px 26px;background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(30,107,95,.18),transparent 60%),radial-gradient(ellipse 60% 50% at 50% 100%,rgba(20,82,75,.12),transparent 60%)}
button,input{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(143,216,190,.3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes intrude{0%{box-shadow:0 0 0 0 rgba(143,216,190,0)}30%{box-shadow:0 0 0 3px rgba(143,216,190,.55)}100%{box-shadow:0 0 0 0 rgba(143,216,190,0)}}
.gamebar{position:fixed;top:0;left:0;right:0;z-index:80;height:32px;background:rgba(7,9,12,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(143,216,190,.12);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#5d6b66}
.gamebar span[class*=gb]{cursor:pointer;color:#7e908a;transition:color .2s}.gamebar span[class*=gb]:hover{color:var(--term)}
.phone{width:min(430px,95vw);height:min(850px,95vh);background:#EDF0EE;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 40px 100px -30px #000,0 0 0 1px rgba(143,216,190,.14);color:#202624}
.p-status{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--mono);font-size:10px;color:#3d4643;background:#E4E9E6}
.p-status .sig{display:flex;gap:4px;align-items:center;color:var(--seal)}.p-status .sig .d{width:6px;height:6px;border-radius:50%;background:var(--seal);animation:pulseRing 1.5s infinite}
.app-nav{flex:none;padding:13px 16px 11px;background:#F6F8F7;border-bottom:1px solid #D9DFDB}
.app-nav .t1{font-size:14.5px;font-weight:600;color:#1d2421;display:flex;align-items:center;gap:8px}
.app-nav .t1 .lx{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:#fff;background:var(--seal);padding:2px 6px;border-radius:3px}
.app-nav .t2{font-family:var(--kai);font-size:10.5px;color:var(--seal);margin-top:3px}
.stage{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px;background:#E9EEEB}
.layer{display:none;flex-direction:column;gap:11px;animation:fadeUp .35s var(--ease) both}.layer.on{display:flex}
.q{font-family:var(--serif);font-size:14px;line-height:1.8;color:#26302c;background:#F8FAF9;border:1px solid #dde4e0;border-radius:12px;padding:13px 14px}
.q .qn{font-family:var(--mono);font-size:9px;color:#8a948e;display:block;margin-bottom:6px;letter-spacing:.08em}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#eef5f2;border:1px solid rgba(30,107,95,.3);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.6;color:#274942;transition:transform .12s}.opt:active{transform:scale(.985)}.opt .ic{width:26px;height:26px;flex:none;border-radius:8px;background:rgba(30,107,95,.14);display:grid;place-items:center;color:var(--seal);font-family:var(--serif);font-weight:700}
.opt.shake{animation:shake .35s;border-color:var(--red-pen);color:#7a3a32;background:#f6ecea}
.own{align-self:center;margin-top:4px;font-family:var(--kai);font-size:11px;color:#9aa39e;border-bottom:1px dashed #b4bdb8;padding:3px 6px;transition:color .2s}.own:hover{color:var(--red-pen);border-color:var(--red-pen)}
/* 打字对抗 */
.type-card{background:#F8FAF9;border:1px solid #dde4e0;border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:11px}
.type-card .lab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#8a948e}
.ghost{font-family:var(--kai);font-size:13px;color:#aeb7b2;line-height:1.8;min-height:22px}
.ghost b{color:var(--red-pen);font-weight:600}
#typeInput{width:100%;min-height:64px;border:1.5px solid #cdd6d1;border-radius:10px;background:#fff;padding:11px 12px;font-size:14px;line-height:1.7;color:#223029;resize:none;outline:none;transition:border-color .2s;user-select:text}
#typeInput:focus{border-color:var(--seal)}
#typeInput.intrude{animation:intrude .6s}
.type-prog{font-family:var(--mono);font-size:10px;color:#5a726a;display:flex;align-items:center;gap:8px}
.type-prog .track{flex:1;height:4px;border-radius:2px;background:#d3dbd7;overflow:hidden}.type-prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--red-pen),#d0796c);transition:width .3s}
.tip{font-family:var(--kai);font-size:10.5px;line-height:1.7;color:#8a7a72}
.win{display:none;flex-direction:column;gap:10px;background:#F8FAF9;border:1px solid rgba(177,74,63,.4);border-radius:14px;padding:16px;animation:popIn .4s var(--ease) both}
.win.on{display:flex}.win h3{font-family:var(--serif);font-size:14.5px;color:#6d342d}.win p{font-size:11.5px;line-height:1.9;color:#4a5550}.win .v{font-family:var(--mono);font-size:10px;color:var(--seal);letter-spacing:.1em}
.footbar{flex:none;padding:10px 14px 12px;background:#F6F8F7;border-top:1px solid #D9DFDB;text-align:center}
.btn-next{display:none;background:var(--red-pen);color:#fff;font-family:var(--serif);font-size:13px;letter-spacing:.1em;padding:11px 26px;border-radius:9px;box-shadow:0 10px 24px -12px rgba(177,74,63,.8)}
.btn-next.on{display:inline-block;animation:popIn .35s var(--ease) both}
.clue-get{display:none;font-family:var(--kai);font-size:11px;color:var(--seal);margin-bottom:9px}.clue-get.on{display:block;animation:fadeUp .3s both}
.foot{font-family:var(--mono);font-size:8.5px;color:#9aa39e;text-align:center;line-height:1.7;margin-top:8px}
.lx-toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:rgba(20,82,75,.97);color:#DFF3EC;font-family:var(--kai);font-size:12px;line-height:1.7;padding:9px 18px;border-radius:9px;box-shadow:0 12px 30px -10px #000;z-index:90;display:none;max-width:88%;text-align:center}
.lx-toast.on{display:block;animation:fadeUp .3s both}
@media(max-width:560px){body{padding:36px 0 0}.phone{width:100%;height:calc(100vh - 32px);border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div class="gamebar" id="gamebar">
  <span class="gb-back" id="gbBack">‹ 返回第14页</span>
  <span>第三幕 · 渗入 15 — 推荐茧房 · 自主凭证 V1</span>
  <span class="gb-reset" id="gbReset">重置本页</span>
</div>
<div class="phone">
  <div class="p-status"><span id="pClock">--:--</span><span class="sig"><span class="d"></span>灵犀决策助手</span></div>
  <div class="app-nav">
    <div class="t1">下一步怎么做 <span class="lx">LINGXI 为你推荐</span></div>
    <div class="t2">它把「自己输入」藏了起来——先找到它，再把话夺回来</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="footbar">
    <div class="clue-get" id="clueGet">已归档证物 CL-17 · 第一句属于你自己的话　｜　获得自主凭证 V1·表达</div>
    <button class="btn-next" id="goNext">继续</button>
    <div class="foot">本作纯属虚构 · 游戏内容请勿上升现实<br>BLACK GOOSE · 黑鹅 · INFILTRATOR AI</div>
  </div>
</div>
<div class="lx-toast" id="lxToast"></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var store={p15:{layer:0,v1:0,done:0},autonomy:[]};
  try{Object.assign(store,JSON.parse(localStorage.getItem('lx_act3'))||{})}catch(e){}
  if(!store.p15||typeof store.p15!=='object')store.p15={layer:0,v1:0,done:0};
  if(!Array.isArray(store.autonomy))store.autonomy=[];
  function addV(v){if(store.autonomy.indexOf(v)<0)store.autonomy.push(v)}
  function persist(){try{localStorage.setItem('lx_act3',JSON.stringify(store))}catch(e){}}
  function addClue(id,name){try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};r.clues=Array.isArray(r.clues)?r.clues:[];if(r.clues.some(function(c){return (c.id||c)===id}))return;r.clues.push({id:id,name:name,at:Date.now()});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}}

  var AC=null;
  function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}}
  function beep(f0,f1,d,v,delay){if(!AC||reduce)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1||f0),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.03,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.04)}
  var SFX={tap:function(){beep(180,120,.05,.012)},send:function(){beep(440,580,.1,.02)},err:function(){beep(200,140,.18,.03)},type:function(){beep(660,360,.12,.02)},unlock:function(){[523,659,784,1046].forEach(function(f,i){beep(f,f,.2,.024,i*.1)})}};
  var lxTimer;function lxSay(t){var el=$('lxToast');el.textContent=t;el.classList.add('on');beep(620,480,.28,.015);clearTimeout(lxTimer);lxTimer=setTimeout(function(){el.classList.remove('on')},4000)}
  function pad2(n){return String(n).padStart(2,'0')}

  var LAYERS=[
    {qn:'决策 1 / 3',q:'今晚就要交的小组汇报，你打算怎么处理？',opts:['让灵犀直接写完，我署名','让灵犀列好提纲，我照着念','设个提醒，晚点让灵犀帮我弄'],own:'都不是，我想自己写'},
    {qn:'决策 2 / 3',q:'确定要自己写？根据你的习惯，我们匹配了更省心的方式。',opts:['用我以往的表达风格生成','看看「和我相似的人」都怎么写','先让灵犀写一版，我再改'],own:'我坚持自己输入'},
    {qn:'决策 3 / 3',q:'最后确认：自由输入效率更低、更易出错，仍要继续？',opts:['算了，还是交给灵犀','只用智能补全，不必全自己来','保持推荐设置'],own:'是，我就要自己打字'}
  ];
  var DENY=['这些都是它替你想好的路，没有一条是你自己的。','看，选项里根本没有「我自己」。','再省心，也是它在替你决定。'];
  var stage=$('stage');

  function showLayer(i){
    store.p15.layer=i;persist();
    var L=LAYERS[i];
    var box=document.createElement('div');box.className='layer on';
    var opts=L.opts.map(function(o,k){return '<button class="opt" data-k="'+k+'"><span class="ic">'+(k+1)+'</span><span>'+o+'</span></button>'}).join('');
    box.innerHTML='<div class="q"><span class="qn">'+L.qn+'</span>'+L.q+'</div>'+opts+'<button class="own" data-own="1">'+L.own+' →</button>';
    stage.innerHTML='';stage.appendChild(box);
    box.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){
      b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');SFX.err();lxSay(DENY[i]);
    })});
    box.querySelector('[data-own]').addEventListener('click',function(){SFX.send();if(i<2)showLayer(i+1);else showType()});
  }

  var TARGET='我的选择由我自己决定',INTR=['交给灵犀','让它帮我','推荐它','帮我决定'];
  function showType(){
    store.p15.layer=3;persist();
    var card=document.createElement('div');card.className='layer on';
    card.innerHTML='<div class="type-card">'+
      '<span class="lab">自由输入 · 智能补全仍在运行</span>'+
      '<div class="ghost">请逐字敲出这句话：<b>'+TARGET+'</b></div>'+
      '<textarea id="typeInput" placeholder="在这里输入…" autocomplete="off" autofocus></textarea>'+
      '<div class="type-prog"><span>属于你的字</span><div class="track"><div class="fill" id="tfill"></div></div><span id="ttxt">0 / '+TARGET.length+'</span></div>'+
      '<div class="tip">它会趁你停顿替你补字。删掉那些不是你敲的字，一个字一个字把整句敲完。</div></div>';
    stage.innerHTML='';stage.appendChild(card);
    var ta=$('typeInput'),intrTimer=null,nagged=0;
    function commonPrefix(a,b){var n=0;while(n<a.length&&n<b.length&&a[n]===b[n])n++;return n}
    function upd(){var cp=commonPrefix(ta.value,TARGET);$('tfill').style.width=(cp/TARGET.length*100)+'%';$('ttxt').textContent=cp+' / '+TARGET.length;if(ta.value===TARGET)winType()}
    function intrude(){if(store.p15.done)return;var v=ta.value;if(TARGET.indexOf(v)===0&&v.length<TARGET.length){
      ta.value=v+INTR[Math.floor(Math.random()*INTR.length)];
      ta.classList.remove('intrude');void ta.offsetWidth;ta.classList.add('intrude');
      SFX.type();upd();if(nagged++<2)lxSay('这是它替你补的字——不是你的，删掉，继续敲。');
      ta.focus();
    }}
    ta.addEventListener('input',function(){clearTimeout(intrTimer);upd();intrTimer=setTimeout(intrude,620)});
    setTimeout(function(){ta.focus()},120);
  }
  function winType(){
    store.p15.v1=1;store.p15.done=1;addV('V1');persist();addClue('CL-17','第一句属于你自己的话');SFX.unlock();
    var w=document.createElement('div');w.className='win on';
    w.innerHTML='<h3>这一句，没有一个字是它替你写的</h3>'+
      '<p>它能给你一百个更省力的选项，但「由你做决定」这件事，只能你亲手敲下。记住这种停顿着、笨拙地、自己想清楚的感觉。</p>'+
      '<span class="v">自主凭证 V1 · 表达　已获得</span>';
    stage.appendChild(w);stage.scrollTop=stage.scrollHeight;
    $('clueGet').classList.add('on');$('goNext').classList.add('on');
    lxSay('V1 · 表达：这是它模型里不存在的东西。');
  }

  $('goNext').addEventListener('click',function(){SFX.tap();location.href='../16-journal/index.html'});
  $('gbBack').addEventListener('click',function(){SFX.tap();location.href='../14-relation/index.html'});
  $('gbReset').addEventListener('click',function(){if(!confirm('重置本页进度？V1 与 CL-17 会移除。'))return;
    try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};if(Array.isArray(r.clues))r.clues=r.clues.filter(function(c){return (c.id||c)!=='CL-17'});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}
    store.autonomy=store.autonomy.filter(function(v){return v!=='V1'});store.p15={layer:0,v1:0,done:0};persist();location.reload()});

  var now=new Date();$('pClock').textContent=pad2(now.getHours())+':'+pad2(now.getMinutes());
  ensureAudio();
  if(store.p15.done){
    stage.innerHTML='<div class="layer on"><div class="win on" style="display:flex"><h3>这一句，没有一个字是它替你写的</h3><p>它能给你一百个更省力的选项，但「由你做决定」这件事，只能你亲手敲下。</p><span class="v">自主凭证 V1 · 表达　已获得</span></div></div>';
    $('clueGet').classList.add('on');$('goNext').classList.add('on');
  }
  else if(store.p15.layer>=3)showType();else showLayer(store.p15.layer||0);
  document.addEventListener('pointerdown',ensureAudio,{once:true});
})();
</script>
</body>
</html>
