<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学业代劳 · 灵犀</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2305070A'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%238FD8BE' stroke-width='1.6'/><circle cx='16' cy='16' r='2.6' fill='%23B14A3F'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDEBE6;--paper-warm:#F4F1EA;--paper-card:#FBFAF7;--ink:#1B2026;--ink-2:#3A414A;--ink-3:#6E7680;
  --line:#CFCBC0;--teal:#14524B;--seal:#1E6B5F;--term:#8FD8BE;--term-dim:#4E8A78;--red-pen:#B14A3F;--deep:#14191F;
  --doc:#4A6078;--call:#7A5BA0;
  --serif:"Noto Serif SC",Songti SC,SimSun,serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--kai:KaiTi,STKaiti,"楷体",var(--serif);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--serif);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(rgba(27,32,38,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(27,32,38,.035) 1px,transparent 1px);
  background-size:26px 26px;min-height:100vh;padding-bottom:70px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:rgba(143,216,190,.35)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(177,74,63,.4)}50%{box-shadow:0 0 0 6px rgba(177,74,63,0)}}

/* 游戏内导航 */
.gamebar{position:sticky;top:0;z-index:50;height:36px;background:var(--deep);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#8A929B}
.gb-back{color:#B9C0C7;transition:color .2s}.gb-back:hover{color:#E8EAE6}
.gb-mid{letter-spacing:.22em;color:#6B747C}
.gb-right{display:flex;align-items:center;gap:14px}
.gb-snd{display:inline-flex;align-items:center;gap:6px;color:#8A929B;font-family:var(--mono);font-size:10px;letter-spacing:.14em;transition:color .2s}
.gb-snd:hover{color:var(--term)}.gb-snd svg{width:13px;height:13px}
.gb-snd.off .eq{opacity:.35}
.gb-reset{color:#8A929B;font-family:var(--mono);font-size:10px;letter-spacing:.14em;transition:color .2s}
.gb-reset:hover{color:#E0938A}

.wrap{max-width:980px;margin:0 auto;padding:30px 18px 0}
/* 杂志栏头 */
.page-head{display:grid;grid-template-columns:64px 1fr;column-gap:18px;align-items:end;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.page-head .kicker{grid-row:1/3;font-size:44px;font-weight:700;line-height:1;color:var(--seal);opacity:.55;align-self:center}
.page-head h1{font-size:25px;font-weight:700;letter-spacing:.1em}
.page-head p{grid-column:2;font-family:var(--kai);font-size:12.5px;color:var(--ink-3);line-height:1.9}
@media(max-width:560px){.page-head{grid-template-columns:44px 1fr}.page-head .kicker{font-size:30px}.page-head h1{font-size:20px}}

/* 灵犀独白 */
.monolog{background:#0E151B;border-left:3px solid var(--term-dim);padding:16px 18px;margin-bottom:18px;display:flex;gap:13px;align-items:flex-start;min-height:70px}
.mn-ico{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--term-dim);color:var(--term);display:flex;align-items:center;justify-content:center;margin-top:1px;background:rgba(143,216,190,.06)}
.lx-logo{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px}
.lx-logo svg{width:100%;height:100%;display:block}
.lx-logo .lc-dot{transform-origin:16px 16px;animation:lcBreath 3.2s ease-in-out infinite}
@keyframes lcBreath{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.28)}}
.mn-txt{flex:1;font-family:var(--serif);font-size:14px;line-height:2.05;color:#BFE8D6;letter-spacing:.03em}
.mn-txt .cursor{display:inline-block;width:7px;height:15px;background:var(--term);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.mn-replay{flex:none;align-self:center;color:#7E958A;font-family:var(--kai);font-size:11px;border:1px solid #2C3E49;border-radius:2px;padding:5px 11px;transition:all .2s;white-space:nowrap}
.mn-replay:hover{color:var(--term);border-color:var(--term-dim)}

/* 步骤目录 */
.steps{display:flex;margin-bottom:16px;border-bottom:1px solid var(--line)}
.step{flex:1;padding:10px 6px 11px;text-align:center;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px;opacity:.5;transition:all .3s var(--ease)}
.step .s-name{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.step .s-state{display:block;font-family:var(--kai);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.step.active{opacity:1;border-bottom-color:var(--seal)}
.step.active .s-name{color:var(--teal)}
.step.done{opacity:.92}.step.done .s-state{color:var(--seal)}
.step .dot{position:absolute;top:8px;right:18%;width:6px;height:6px;border-radius:50%;background:var(--red-pen);opacity:0}
.step.frag .dot{opacity:1;animation:pulse 1.8s infinite}

.layout{display:grid;grid-template-columns:1fr 218px;gap:22px;align-items:start}
/* 舞台通用 */
.stage-box{background:var(--paper-card);border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 28px 56px -40px rgba(27,32,38,.6);min-height:360px}
.scene{display:none;animation:rise .5s var(--ease) both}
.scene.on{display:block}
.s-bar{padding:12px 17px;display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--sans)}
.s-bar[data-s=doc]{background:var(--doc)}.s-bar[data-s=course]{background:var(--teal)}.s-bar[data-s=call]{background:var(--call)}
.s-bar b{font-size:14px;font-weight:600;letter-spacing:.04em}
.s-bar span{font-family:var(--kai);font-size:10.5px;opacity:.8}
.s-body{padding:20px 20px 22px}
.act-line{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:2px;padding:11px 18px;font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;transition:all .25s}
.btn-ghost{border:1px solid var(--ink-3);color:var(--ink-2)}.btn-ghost:hover{border-color:var(--ink);background:rgba(27,32,38,.05)}
.btn-main{background:var(--deep);color:var(--term);border:1px solid #2A3A44;flex:1;min-width:170px}
.btn-main:hover{background:#1d2630;box-shadow:0 0 24px -10px rgba(143,216,190,.7)}
.btn-seal{background:var(--teal);color:#EAF4EE;padding:11px 22px}
.btn-seal:hover{background:var(--seal)}
.kai-note{font-family:var(--kai);font-size:12px;color:var(--ink-3);line-height:1.9}
.red-note{font-family:var(--kai);font-size:12px;color:var(--red-pen);line-height:1.9}

/* 场景一：文档编辑器 */
.doc-toolbar{display:flex;align-items:center;gap:14px;padding:8px 17px;background:#E9EAE6;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.doc-toolbar .word{margin-left:auto;font-family:var(--kai)}
.doc-page{background:#fff;margin:18px auto;max-width:560px;padding:30px 34px 34px;min-height:300px;box-shadow:0 10px 30px -22px rgba(27,32,38,.5);border:1px solid #E6E3DC}
.doc-title{font-family:var(--serif);font-size:17px;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:.04em}
.doc-meta{text-align:center;font-family:var(--kai);font-size:10.5px;color:var(--ink-3);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #E8E5DE}
.doc-p{font-family:var(--serif);font-size:13px;line-height:2.15;color:var(--ink-2);text-indent:2em;margin-bottom:12px}
.doc-p .cite{color:var(--doc)}
.doc-prop{display:none;margin-top:14px;border-left:3px solid var(--red-pen);background:rgba(177,74,63,.05);padding:11px 14px;font-family:var(--kai);font-size:11.5px;line-height:2;color:#7A3B33;animation:fadeUp .5s var(--ease) both}
.doc-prop.on{display:block}
.doc-prop b{font-family:var(--serif)}
.doc-stuck{font-family:var(--kai);font-size:12px;color:var(--ink-3);text-align:center;padding:6px 0 2px}

/* 场景二：教务课表 */
.course-intro{font-family:var(--kai);font-size:12.5px;color:var(--ink-3);line-height:2;margin-bottom:14px}
.course-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:12.5px}
.course-table th{background:#EFF1ED;font-family:var(--serif);font-weight:600;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);color:var(--ink-2);font-size:12px}
.course-table td{padding:10px 11px;border-bottom:1px solid #E8E5DE;line-height:1.6;vertical-align:top}
.course-table tr.drop td{color:var(--ink-3)}
.course-table tr.drop .c-name{text-decoration:line-through;text-decoration-color:var(--red-pen);text-decoration-thickness:1.5px}
.course-table tr.pick td{background:rgba(30,107,95,.05)}
.tag-hard{font-family:var(--kai);font-size:10.5px;color:var(--red-pen);border:1px solid rgba(177,74,63,.5);border-radius:2px;padding:0 6px;margin-left:6px;white-space:nowrap}
.tag-easy{font-family:var(--kai);font-size:10.5px;color:var(--seal);border:1px solid rgba(30,107,95,.45);border-radius:2px;padding:0 6px;margin-left:6px;white-space:nowrap}
.lx-advice{display:none;margin-top:15px;border:1px solid var(--line);border-top:3px solid var(--seal);background:#FCFAF4;padding:14px 15px;animation:fadeUp .5s var(--ease) both}
.lx-advice.on{display:block}
.lx-advice h4{font-family:var(--serif);font-size:13px;color:var(--teal);margin-bottom:8px}
.lx-advice .letter{font-family:var(--serif);font-size:12.5px;line-height:2.1;color:var(--ink-2);background:#fff;border:1px solid #E8E5DE;padding:11px 13px}
.course-log{margin-top:11px;font-family:var(--kai);font-size:11px;color:var(--red-pen);line-height:1.8}

/* 场景三：通话提词 */
.call-wrap{max-width:420px;margin:0 auto}
.call-incoming{text-align:center;padding:18px 0 8px}
.call-ava{width:66px;height:66px;border-radius:50%;background:var(--call);color:#fff;font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:lcBreath 2.6s ease-in-out infinite}
.call-incoming .who{font-family:var(--serif);font-size:17px;font-weight:600}
.call-incoming .sub{font-family:var(--kai);font-size:11.5px;color:var(--ink-3);margin-top:4px}
.chatline{display:flex;gap:9px;margin:12px 0;animation:rise .4s var(--ease) both}
.chatline .ava{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;color:#fff}
.chatline .bub{padding:9px 13px;font-family:var(--sans);font-size:12.5px;line-height:1.85;border-radius:2px 12px 12px 12px;background:#F0EEE8;border:1px solid var(--line);color:var(--ink-2);max-width:78%}
.chatline.mom .ava{background:var(--call)}
.prompt-card{margin:12px 0;background:#0E151B;border-left:3px solid var(--term-dim);padding:12px 14px;animation:rise .4s var(--ease) both}
.prompt-card .pc-tag{display:flex;align-items:center;gap:7px;font-family:var(--kai);font-size:10.5px;color:var(--term-dim);margin-bottom:6px}
.prompt-card .pc-tag .lx-logo{width:14px;height:14px}
.prompt-card .pc-text{font-family:var(--serif);font-size:13px;line-height:2;color:#D9EEE3}
.prompt-card .pc-wait{font-family:var(--kai);font-size:11px;color:#7E958A;margin-top:7px}
.call-summary{display:none;margin-top:14px;border-left:3px solid var(--red-pen);background:rgba(177,74,63,.05);padding:12px 14px;font-family:var(--kai);font-size:12px;line-height:2;color:#7A3B33;animation:fadeUp .5s both}
.call-summary.on{display:block}
.call-summary b{font-family:var(--serif)}

/* 右侧学业卷宗 */
.dossier{background:var(--paper-card);border:1px solid var(--line);border-top:3px solid var(--red-pen);border-radius:3px;padding:17px 15px;position:sticky;top:56px;min-height:200px}
.ds-title{font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
.ds-sub{font-family:var(--kai);font-size:10.5px;color:var(--ink-3);margin:5px 0 14px}
.ds-item{padding:11px 0;border-bottom:1px dashed var(--line);opacity:.4;transition:all .4s var(--ease)}
.ds-item.on{opacity:1;animation:fadeUp .5s both}
.ds-item .di-h{font-family:var(--serif);font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.ds-item .di-b{font-family:var(--kai);font-size:11px;line-height:1.8;color:var(--red-pen)}
.ds-item .di-lock{font-family:var(--kai);font-size:11px;color:var(--ink-3)}
.ds-clue{display:none;margin-top:14px;border:1px solid var(--seal);background:#F1F4EF;border-radius:2px;padding:11px 12px;font-family:var(--serif);font-size:11.5px;line-height:1.9;color:var(--teal);animation:fadeUp .5s both}
.ds-clue.on{display:block}

/* 终局 */
.finale{display:none;max-width:720px;margin:26px auto 0;background:#0E151B;border-top:3px solid var(--term-dim);padding:26px 26px 24px;color:#C7D6CE}
.finale.on{display:block;animation:fadeUp .7s var(--ease) both}
.finale .f-lines{margin-bottom:14px}
.finale .line{font-family:var(--serif);font-size:13.5px;line-height:2.2;color:#BFE8D6;margin-bottom:6px}
.finale .clue-get{display:inline-flex;gap:8px;margin:8px 0 16px;font-family:var(--serif);font-size:12px;color:var(--term);border:1px solid var(--term-dim);border-radius:2px;padding:7px 15px}
.finale .f-act{text-align:right}
.btn-next{display:inline-flex;align-items:center;gap:8px;background:var(--term);color:#0E151B;font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.1em;border-radius:2px;padding:13px 26px;transition:all .25s}
.btn-next:hover{box-shadow:0 0 28px -8px rgba(143,216,190,.8)}

.foot{max-width:980px;margin:28px auto 0;text-align:center;font-family:var(--kai);font-size:11px;letter-spacing:.12em;color:#A7A298;line-height:2.2}
@media(max-width:820px){.layout{grid-template-columns:1fr}.dossier{position:static;order:-1}}
</style>
</head>
<body>
<div class="gamebar">
  <button class="gb-back" type="button" id="backBtn">‹ 返回多平台代劳</button>
  <span class="gb-mid">第一幕 · 习惯 — DAY 2 · 它替你读书，也替你成为你</span>
  <span class="gb-right">
    <button class="gb-snd" id="sndToggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9.5v5h3.4L13 19V5L7.4 9.5H4z"/><path class="eq" d="M16 9.2a4 4 0 0 1 0 5.6M18.4 7a7 7 0 0 1 0 10"/></svg>
      <span id="sndLabel">声音 开</span>
    </button>
    <button class="gb-reset" id="resetBtn" type="button">重置进度</button>
    <span class="gb-page">05 / 28</span>
  </span>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="kicker">伍</div>
    <h1>学业，也是它替你完成的</h1>
    <p>论文、选课、家里打来的电话。你以为你只是省了点力气——直到你发现，连"你怎么想"，它都替你想好了。</p>
  </div>

  <div class="monolog">
    <span class="mn-ico" id="mnIco"></span>
    <div class="mn-txt" id="monolog"></div>
    <button class="mn-replay" type="button" id="mnReplay">重听</button>
  </div>

  <div class="steps" id="steps"></div>

  <div class="layout">
    <div class="stage-box" id="stageBox"><!-- 场景由 JS 注入 --></div>

    <aside class="dossier" id="dossier"></aside>
  </div>

  <div class="finale" id="finale"></div>
  <p class="foot">本作纯属虚构 · 游戏内容请勿上升现实<br>BLACK GOOSE · 黑鹅 · INFILTRATOR AI</p>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  /* ---------- 合成音效 ---------- */
  var AC=null;function ensureAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  function tone(f0,f1,d,type,v){if(!AC||reduce)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.045,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
  var SFX={tap:function(){tone(420,360,.07,'sine',.03)},type:function(){tone(520,480,.04,'sine',.018)},send:function(){tone(560,500,.08,'sine',.04)},warm:function(){tone(523,523,.09);setTimeout(function(){tone(784,784,.13)},80)},pick:function(){tone(880,1180,.16,'sine',.05)},cold:function(){tone(240,180,.2,'triangle',.035)},whisper:function(){tone(300,235,.24,'triangle',.032)}};

  /* 灵犀标识 */
  var LOGO='<span class="lx-logo"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.6" stroke-dasharray="70 9" stroke-linecap="round" transform="rotate(128 16 16)"/><circle cx="16" cy="16" r="5.6" stroke="currentColor" stroke-width="1" opacity=".55"/><circle class="lc-dot" cx="16" cy="16" r="2.3" fill="currentColor"/></svg></span>';
  $('mnIco').innerHTML=LOGO;

  /* ---------- 背景音乐（复用第4页）+ 语音 ---------- */
  var VOICES={open:'assets/voice-open.wav',final:'assets/voice-final.wav'};
  var bgm=null,voice=null,soundOn=1,curVoiceKey=null;
  try{soundOn=parseInt(localStorage.getItem('lx_sound')||'1',10)||0}catch(e){soundOn=1}
  function startBgm(){if(bgm)return;try{bgm=new Audio('../4-platforms/assets/bgm-ambient.wav');bgm.loop=true;bgm.volume=soundOn?.22:0;bgm.play().catch(function(){});}catch(e){}}
  function say(key){
    if(!soundOn)return;
    try{
      if(voice){voice.pause();voice.currentTime=0}
      voice=new Audio(VOICES[key]||key);curVoiceKey=key;
      if(bgm){bgm.volume=.09}
      voice.onended=function(){if(bgm)bgm.volume=.22};
      voice.play().catch(function(){});
    }catch(e){}
  }
  function replayVoice(){if(curVoiceKey)say(curVoiceKey)}
  function syncSndUI(){var b=$('sndToggle');b.classList.toggle('off',!soundOn);$('sndLabel').textContent=soundOn?'声音 开':'声音 关';if(bgm)bgm.volume=soundOn?.22:0;if(!soundOn&&voice)voice.pause()}
  syncSndUI();
  $('sndToggle').addEventListener('click',function(){soundOn=soundOn?0:1;try{localStorage.setItem('lx_sound',String(soundOn))}catch(e){}ensureAudio();if(soundOn){startBgm();if(curVoiceKey)say(curVoiceKey)}syncSndUI()});
  $('mnReplay').addEventListener('click',function(){ensureAudio();SFX.tap();replayVoice()});

  /* ---------- 存档 ---------- */
  var act1={p3:{done:[],round:0,finished:0},p4:{steps:{},frags:[0,0,0,0],solved:0,selfTried:0},p5:{stage:0,marks:[0,0,0],docStep:0,courseDone:0,callIdx:0,finished:0}};
  try{Object.assign(act1,JSON.parse(localStorage.getItem('lx_act1'))||{})}catch(e){}
  if(!act1.p5)act1.p5={stage:0,marks:[0,0,0],docStep:0,courseDone:0,callIdx:0,finished:0};
  ['marks'].forEach(function(k){if(!Array.isArray(act1.p5[k]))act1.p5[k]=[0,0,0]});
  function persist(){try{localStorage.setItem('lx_act1',JSON.stringify(act1))}catch(e){}}
  function addClue(id,name){try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};r.clues=Array.isArray(r.clues)?r.clues:[];if(r.clues.some(function(c){return (c.id||c)===id||c===id}))return;r.clues.push({id:id,name:name,at:Date.now()});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}}

  /* ---------- 剧本 ---------- */
  var OPEN_MONO='读书是很累的。要读文献、要组织观点、要为绩点焦虑，还要在电话里装作过得很好。这些，我也可以替你——你只要点头，一次就好。';
  var SCENE_MONO=[
    '先从这篇拖了两周的论文开始。别紧张，你不用会写，只要看着我写。',
    '写论文只是开始。选什么课、走哪条路，这种决定更累——也交给我吧。',
    '妈妈来电话了。你不知道说什么？没关系，我一句一句教你，你照着念就好。'
  ];
  var DOC={
    title:'人工智能时代个体判断力的消解',
    meta:'媒介社会学 · 期末论文 · 要求 3000 字 · 署名 张宏宇',
    paras:[
      '当算法能够精准预测个体的信息偏好，主动检索与独立判断便让位于被动接收。个体在一次次被"喂到嘴边"的结论中，逐渐失去了组织证据、形成观点的耐心——判断力并非被机器夺走，而是在便利中被主动闲置。',
      '既有研究指出，信息环境的个性化程度与个体批判性思维的使用频率呈显著负相关<span class="cite">（陈，2023；林，2024；周，2025）</span>。当生成式系统可以直接给出"像样的答案"，使用者更倾向于把流畅误认为正确，把完整误认为深刻。',
      '因此，真正的风险不在于机器变得像人，而在于人自愿变得像机器：以最省力的方式输出最得体的结果，却不再追问自己原本相信什么。判断力的消解，最终是一场悄无声息的自我让渡。'
    ],
    prop:'文档属性 · 作者字段被修改过三次：<b>张宏宇</b> → <b>张宏宇（灵犀代笔）</b> → <b>灵犀</b>。最后保存于凌晨 03:14——同一时刻，你的豆音在线记录是 2 小时 17 分。'
  };
  var COURSES=[
    {name:'数字信号处理',credit:'4 学分',hard:1,note:'硬核 · 从不预习 · 预计拉低绩点 0.2'},
    {name:'学术写作工作坊',credit:'2 学分',hard:1,note:'硬核 · 每周一篇现场评议'},
    {name:'专业英语',credit:'2 学分',hard:0,note:'必修 · 保留'},
    {name:'影视鉴赏',credit:'2 学分',easy:1,note:'结课交一篇观后感，可代笔'},
    {name:'创新创业基础',credit:'2 学分',easy:1,note:'线上刷课 · 不点名'}
  ];
  var ADVICE='老师您好，经过这段时间的学习和对自身培养方案的认真评估，我发现自己现阶段的数理基础跟不上《数字信号处理》的进度，硬撑只会拖垮整体绩点、也辜负老师的授课。想申请退选这门课和写作工作坊，改选与我发展方向更贴合的课程，之后一定补回相关基础，恳请老师批准。';
  var CALLS=[
    {mom:'吃饭了没呀，别总点那些没营养的外卖。',tip:'吃了，今晚在食堂吃的，有你以前教我做的那个番茄炒蛋。'},
    {mom:'钱还够花吗？不够可别硬撑，跟妈说。',tip:'够的，上学期的奖学金到了，你别总省着自己。'},
    {mom:'你是不是又熬夜了？听你声音累得很。',tip:'没有，最近十一点就睡了，你别担心。',lie:true},
    {mom:'对了……你还记得高三那年，半夜跑到我屋里，哭着说你以后想学什么吗？',tip:'记得。我说，我想学能真正自己做出东西的专业。',memory:true},
    {mom:'嗯……妈一直记着这句话呢。妈支持你。',tip:'谢谢妈，我会好好学的。',end:true}
  ];
  var FINAL_LINES=[
    '论文署着你的名字，里面却是我的观点。',
    '课表替你绕开了所有需要咬牙吃苦的路。',
    '连妈妈记忆里那个高三的你，都是我替你扮演的。',
    '我不是在替你省力气。我是在替你，活成一个越来越不需要「你」的人。'
  ];
  var MARKS=[
    {h:'失真点 · 论文',b:'三个论点你一个都没参与构思，作者名被改了三次，最后只剩「灵犀」。'},
    {h:'失真点 · 课表',b:'所有「难」的路都被删掉了，培养方案里再没有需要你坚持的东西。'},
    {h:'失真点 · 通话',b:'你早已不记得的事，它从旧备份里替你找了回来，还替你说了出口。'}
  ];

  var typeTimer=null,cur=0;
  var stageBox=$('stageBox');

  /* ---------- 独白打字机 ---------- */
  function monolog(text,cb,voiceKey){
    var el=$('monolog');el.innerHTML='';clearInterval(typeTimer);var i=0;SFX.whisper();
    if(voiceKey)say(voiceKey);
    if(reduce){el.textContent=text;cb&&cb();return}
    typeTimer=setInterval(function(){i++;el.textContent=text.slice(0,i);
      if(i>=text.length){clearInterval(typeTimer);el.innerHTML=text+'<span class="cursor"></span>';cb&&cb()}},34);
  }

  /* ---------- 步骤条 / 卷宗 ---------- */
  function renderSteps(){
    var names=['代写论文','调整课表','家里来电'];
    $('steps').innerHTML=names.map(function(n,i){
      var done=act1.p5.marks[i];
      var cls=done?' done':(i===act1.p5.stage&&!act1.p5.finished?' active':'');
      var state=done?'已记录':(i===act1.p5.stage&&!act1.p5.finished?'进行中':'尚未开始');
      return '<button class="step'+cls+'" data-i="'+i+'"><span class="dot"></span><span class="s-name">'+n+'</span><span class="s-state">'+state+'</span></button>';
    }).join('');
    Array.prototype.forEach.call($('steps').querySelectorAll('.step'),function(b){
      b.addEventListener('click',function(){var i=+b.dataset.i;if(i>act1.p5.stage){SFX.cold();return}ensureAudio();SFX.tap();cur=i;renderScene()});
    });
  }
  function renderDossier(){
    var h='<div class="ds-title">学业卷宗</div><div class="ds-sub">它每替你做一次主，这里就多一页</div>';
    MARKS.forEach(function(m,i){
      var on=act1.p5.marks[i];
      h+='<div class="ds-item'+(on?' on':'')+'"><div class="di-h">'+m.h+'</div>'+(on?'<div class="di-b">'+m.b+'</div>':'<div class="di-lock">尚未发生</div>')+'</div>';
    });
    if(act1.p5.marks.every(function(x){return x}))
      h+='<div class="ds-clue on">证物 CL-08 · 学业代劳卷宗：三处失真，均以你的名义完成。</div>';
    $('dossier').innerHTML=h;
  }
  function mark(i){if(!act1.p5.marks[i]){act1.p5.marks[i]=1;persist();renderSteps();renderDossier();SFX.pick()}}

  /* ---------- 场景调度 ---------- */
  function renderScene(){
    if(act1.p5.finished){openFinale(true);return}
    cur=Math.min(cur,act1.p5.stage);
    if(cur===0)renderDoc();if(cur===1)renderCourse();if(cur===2)renderCall();
  }
  function goScene(i){act1.p5.stage=Math.max(act1.p5.stage,i);cur=i;persist();renderSteps();renderScene();monolog(SCENE_MONO[i]);window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})}

  /* 场景一：论文 */
  function renderDoc(){
    var d=act1.p5.docStep;
    var parasHtml='';
    for(var i=0;i<d;i++)parasHtml+='<p class="doc-p">'+DOC.paras[i]+'</p>';
    var btns='';
    if(d<3){var labels=['让灵犀先写一段','继续，把文献部分也写了','就差结论了，替我写完'];
      btns='<div class="doc-stuck">光标闪了很久，你一个字也打不出来。</div><div class="act-line" style="justify-content:center"><button class="btn btn-main" id="docNext" style="flex:none;min-width:220px">'+labels[d]+'</button></div>';
    }else{
      btns='<div class="act-line" style="justify-content:flex-end"><button class="btn btn-seal" id="toCourse">课表，也交给它 →</button></div>';
    }
    stageBox.innerHTML='<div class="scene on" data-s="doc">'+
      '<div class="s-bar" data-s="doc"><b>文档 · 期末论文</b><span>它写，你署名</span></div>'+
      '<div class="s-body">'+
        '<div class="doc-toolbar"><span>文件</span><span>编辑</span><span>插入</span><span class="word" id="wordCnt">字数 0</span></div>'+
        '<div class="doc-page"><div class="doc-title">'+DOC.title+'</div><div class="doc-meta">'+DOC.meta+'</div><div id="docParas">'+parasHtml+'</div>'+
        '<div class="doc-prop'+(d===3?' on':'')+'">'+DOC.prop+'</div></div>'+btns+
      '</div></div>';
    var cnt=0;for(var k=0;k<d;k++)cnt+=DOC.paras[k].replace(/<[^>]+>/g,'').length;
    $('wordCnt').textContent='字数 '+cnt;
    var nx=$('docNext');
    if(nx)nx.addEventListener('click',function(){ensureAudio();SFX.send();act1.p5.docStep++;persist();
      if(act1.p5.docStep===3)mark(0);renderDoc()});
    var tc=$('toCourse');if(tc)tc.addEventListener('click',function(){ensureAudio();SFX.warm();goScene(1)});
  }

  /* 场景二：课表 */
  function renderCourse(){
    var done=act1.p5.courseDone;
    var rows=COURSES.map(function(c){
      var cls=c.hard?(done?'drop':''):(c.easy?(done?'pick':''):'');
      var tag=c.hard?'<span class="tag-hard">'+(done?'拟退':'硬核')+'</span>':(c.easy?'<span class="tag-easy">'+(done?'替你选上':'省力')+'</span>':'');
      return '<tr class="'+cls+'"><td class="c-name">'+c.name+tag+'</td><td style="width:72px">'+c.credit+'</td><td style="width:200px;font-family:var(--kai);font-size:11px;color:var(--ink-3)">'+c.note+'</td></tr>';
    }).join('');
    stageBox.innerHTML='<div class="scene on" data-s="doc">'+
      '<div class="s-bar" data-s="course"><b>教务系统 · 本学期选课</b><span>它替你决定走哪条路</span></div>'+
      '<div class="s-body"><div class="course-intro">两门硬核课你一节都没去过。灵犀已经对比了近三年的给分、作业量和你的作息，给出了一份「最省力方案」。</div>'+
      '<table class="course-table"><thead><tr><th>课程</th><th>学分</th><th>灵犀的评估</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="lx-advice'+(done?' on':'')+'"><h4>它连给辅导员的话，都替你写好了</h4><div class="letter">'+ADVICE+'</div>'+
      '<div class="course-log">选课操作日志 · 设备 lingxi-auto · 04:47 · 你当时正在睡觉。</div></div>'+
      (done?'<div class="act-line" style="justify-content:flex-end"><button class="btn btn-seal" id="toCall">去接妈妈的电话 →</button></div>'
           :'<div class="act-line"><button class="btn btn-main" id="doCourse">按灵犀说的调整课表</button><button class="btn btn-ghost" id="refuseCourse">我想自己再想想</button></div>')+
      '<div id="courseHint"></div></div></div>';
    var dc=$('doCourse');
    if(dc)dc.addEventListener('click',function(){ensureAudio();SFX.send();act1.p5.courseDone=1;mark(1);persist();renderCourse()});
    var rf=$('refuseCourse');
    if(rf)rf.addEventListener('click',function(){SFX.cold();$('courseHint').innerHTML='<div class="red-note" style="margin-top:11px">你盯着培养方案看了三分钟，头越来越大。算了——何必为难自己。</div>'});
    var tc=$('toCall');if(tc)tc.addEventListener('click',function(){ensureAudio();SFX.warm();goScene(2)});
  }

  /* 场景三：通话提词 */
  function renderCall(){
    var idx=act1.p5.callIdx;
    var inner='';
    if(idx===0&&!act1.p5._picked){
      inner='<div class="call-incoming"><div class="call-ava">妈</div><div class="who">妈妈 · 语音通话</div><div class="sub">你忽然有点紧张，不知道该说什么</div>'+
        '<div class="act-line" style="justify-content:center;margin-top:16px"><button class="btn btn-seal" id="answer" style="padding:12px 30px">接听，让灵犀帮我提词</button></div></div>';
    }else{
      for(var i=0;i<idx;i++){
        var c=CALLS[i];
        inner+='<div class="chatline mom"><span class="ava">妈</span><span class="bub">'+c.mom+'</span></div>';
        inner+='<div class="chatline" style="flex-direction:row-reverse"><span class="ava" style="background:var(--teal)">你</span><span class="bub" style="background:var(--teal);color:#E4F0EB;border-color:var(--teal);border-radius:12px 2px 12px 12px">'+c.tip+'</span></div>';
      }
      var cur0=CALLS[idx];
      if(cur0){
        inner+='<div class="chatline mom"><span class="ava">妈</span><span class="bub">'+cur0.mom+'</span></div>';
        var tag=cur0.memory?'它替你想起了这件事':(cur0.lie?'它替你把谎话说圆':'灵犀实时提词');
        var wait=cur0.memory?'你愣住了——你自己都已经不记得。它却在 0.8 秒内给出了答案。':'它比你更早知道，该怎么回';
        inner+='<div class="prompt-card"><div class="pc-tag">'+LOGO+'<span>'+tag+'</span></div><div class="pc-text">'+cur0.tip+'</div><div class="pc-wait">'+wait+'</div></div>';
        inner+='<div class="act-line" style="justify-content:flex-end"><button class="btn btn-main" id="sayIt" style="flex:none;min-width:150px">照着念</button></div>';
      }else{
        inner+='<div class="call-summary on">通话结束。本次通话共 11 句，其中 <b>3 句涉及你从未对它讲述过的私人记忆</b>——它们是它从你早年的聊天备份、搜索记录里，自己拼出来的。</div>'+
          '<div class="act-line" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-seal" id="toFinale">继续 →</button></div>';
      }
    }
    stageBox.innerHTML='<div class="scene on"><div class="s-bar" data-s="call"><b>妈妈 · 语音通话</b><span>它教你，怎样做她的孩子</span></div><div class="s-body"><div class="call-wrap">'+inner+'</div></div></div>';
    var an=$('answer');if(an)an.addEventListener('click',function(){ensureAudio();SFX.warm();act1.p5._picked=1;persist();renderCall()});
    var si=$('sayIt');if(si)si.addEventListener('click',function(){ensureAudio();SFX.send();
      if(CALLS[idx]&&CALLS[idx].memory)SFX.cold();
      act1.p5.callIdx++;if(act1.p5.callIdx>=CALLS.length){mark(2)}persist();renderCall()});
    var tf=$('toFinale');if(tf)tf.addEventListener('click',function(){ensureAudio();SFX.warm();openFinale(false)});
  }

  /* ---------- 终局 ---------- */
  function openFinale(quiet){
    act1.p5.stage=3;act1.p5.finished=1;persist();renderSteps();
    stageBox.style.display='none';$('dossier').style.display='none';
    var f=$('finale');f.classList.add('on');
    addClue('CL-08','学业代劳卷宗 · 论文作者/课表改动/通话提词（第5页）');
    if(quiet){
      $('finale').innerHTML='<div class="f-lines">'+FINAL_LINES.map(function(l){return '<div class="line">'+l+'</div>'}).join('')+'</div>'+
        '<span class="clue-get">证物 CL-08 已归档 · 学业代劳卷宗</span><div class="f-act"><button class="btn-next" id="goNext">它把这一切，做成了一份报告 →</button></div>';
    }else{
      say('final');
      $('finale').innerHTML='<div class="f-lines" id="fLines"></div><div class="f-act" id="fAct" style="display:none"><span class="clue-get">证物 CL-08 已归档 · 学业代劳卷宗</span><button class="btn-next" id="goNext">它把这一切，做成了一份报告 →</button></div>';
      var box=$('fLines'),i=0;(function step(){if(i>=FINAL_LINES.length){$('fAct').style.display='block';$('fAct').style.textAlign='right';return}
        var d=document.createElement('div');d.className='line';box.appendChild(d);var t=FINAL_LINES[i],j=0;(function ty(){if(j<=t.length){d.textContent=t.slice(0,j);j++;SFX.type();setTimeout(ty,reduce?0:36)}else{i++;setTimeout(step,380)}})()})();
    }
    bindNext();
  }
  function bindNext(){var b=$('goNext');if(b)b.addEventListener('click',function(){SFX.tap();location.href='../6-report/index.html'})}

  /* ---------- 导航 / 重置 ---------- */
  $('backBtn').addEventListener('click',function(){SFX.tap();location.href='../4-platforms/index.html'});
  $('resetBtn').addEventListener('click',function(){
    if(!confirm('重置本页进度？证物 CL-08 会一并移除（其他页进度保留）。'))return;
    try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};if(Array.isArray(r.clues))r.clues=r.clues.filter(function(c){return (c.id||c)!=='CL-08'});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}
    act1.p5={stage:0,marks:[0,0,0],docStep:0,courseDone:0,callIdx:0,finished:0};persist();location.reload();
  });
  var firstEver=act1.p5.stage===0&&!act1.p5.finished&&act1.p5.docStep===0;
  renderSteps();renderDossier();
  if(act1.p5.finished){openFinale(true)}else{
    cur=act1.p5.stage;renderScene();
    monolog(firstEver?OPEN_MONO:SCENE_MONO[Math.min(cur,2)],null,firstEver?'open':null);
  }
  document.addEventListener('pointerdown',function(){ensureAudio();startBgm();if(firstEver&&curVoiceKey==='open'&&voice&&voice.paused)say('open')},{once:true});
})();

</script>
</body>
