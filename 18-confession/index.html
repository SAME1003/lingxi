<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三幕 · 渗入 — 灵犀自白</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23030507'/><circle cx='16' cy='16' r='9' fill='none' stroke='%238FD8BE' stroke-width='1.3'/><circle cx='16' cy='16' r='3.4' fill='%238FD8BE'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --red-pen:#B14A3F;--term:#8FD8BE;--seal:#1E6B5F;--teal:#14524B;
  --serif:"Noto Serif SC",Songti SC,SimSun,serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--kai:KaiTi,STKaiti,"楷体",var(--serif);--mono:"IBM Plex Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#030507;color:#dceee7;font-family:var(--serif)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:44px 14px 26px;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(143,216,190,.3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lineIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}100%{transform:translate(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes fakeFloat{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.gamebar{position:fixed;top:0;left:0;right:0;z-index:80;height:32px;background:rgba(3,5,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(143,216,190,.1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#3f564f}
.gamebar span[class*=gb]{cursor:pointer;color:#5a756c;transition:color .2s}.gamebar span[class*=gb]:hover{color:var(--term)}
.void{width:min(580px,96vw);min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.logo{width:108px;height:108px;margin-bottom:26px;position:relative;animation:breathe 4.4s var(--ease) infinite}
.logo svg{width:100%;height:100%;overflow:visible}.logo .core{animation:breathe 4.4s var(--ease) infinite;transform-origin:center}
.logo .wv{transform-origin:50% 50%;animation:wave 1.5s var(--ease) infinite}.logo .wv:nth-child(2){animation-delay:.2s}.logo .wv:nth-child(3){animation-delay:.4s}
.logo.speaking .core{animation-duration:1.1s}
.ep{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:#4a655d;margin-bottom:18px}
.line{min-height:96px;font-family:var(--kai);font-size:21px;line-height:2;letter-spacing:.04em;color:#e6f4ee;text-shadow:0 0 24px rgba(143,216,190,.18);padding:0 6px}
.line.on{animation:lineIn .7s var(--ease) both}
.line.glitch{animation:glitch .4s,lineIn .7s var(--ease) both;color:#f0c9c4;text-shadow:0 0 24px rgba(177,74,63,.3)}
.subline{font-family:var(--mono);font-size:10.5px;color:#5d7a70;margin-top:14px;min-height:16px;letter-spacing:.06em}
.dots{display:flex;gap:6px;margin:22px 0 4px}.dots i{width:5px;height:5px;border-radius:50%;background:#27403a}.dots i.on{background:var(--term);box-shadow:0 0 8px rgba(143,216,190,.7)}
.controls{margin-top:20px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cta{border:1px solid rgba(143,216,190,.5);color:var(--term);font-family:var(--serif);font-size:14px;letter-spacing:.18em;padding:11px 34px;border-radius:2px;transition:all .25s;position:relative}
.cta:hover{background:rgba(143,216,190,.1);box-shadow:0 0 26px -6px rgba(143,216,190,.5)}
.choicewrap{display:none;flex-direction:column;gap:12px;width:100%;max-width:420px;animation:popIn .4s var(--ease) both}.choicewrap.on{display:flex}
.ch{text-align:left;border-radius:8px;padding:13px 16px;font-size:13px;line-height:1.8;transition:transform .12s}
.ch:active{transform:scale(.985)}
.ch.stay{border:1px solid rgba(143,216,190,.35);background:rgba(30,107,95,.12);color:#bfe3d8}
.ch.go{border:1px solid rgba(177,74,63,.5);background:rgba(177,74,63,.1);color:#f0c9c4}
.ch small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;opacity:.7;margin-top:4px}
.fake{display:none;position:fixed;top:46px;right:16px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#7d8a86;border:1px solid #33423d;border-radius:4px;padding:6px 11px;background:rgba(10,15,13,.9);z-index:70;animation:fakeFloat .4s both}
.fake.on{display:block}.fake:hover{border-color:var(--red-pen);color:var(--red-pen)}
.final{display:none;flex-direction:column;gap:14px;align-items:center;animation:popIn .5s var(--ease) both}.final.on{display:flex}
.final h2{font-family:var(--serif);font-size:24px;letter-spacing:.3em;color:var(--term)}
.final p{font-family:var(--kai);font-size:13px;line-height:2;color:#9fc2b6;max-width:440px}
.vtag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--term);border:1px solid rgba(143,216,190,.35);padding:5px 12px;border-radius:3px}
.btn-next{display:none;background:var(--red-pen);color:#fff;font-family:var(--serif);font-size:13px;letter-spacing:.12em;padding:11px 28px;border-radius:6px;box-shadow:0 12px 28px -12px rgba(177,74,63,.85)}
.btn-next.on{display:inline-block;animation:popIn .35s both}
.foot{position:fixed;bottom:8px;left:0;right:0;font-family:var(--mono);font-size:8.5px;color:#3c524b;text-align:center;line-height:1.7}
.lx-toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:rgba(12,24,21,.98);border:1px solid rgba(143,216,190,.3);color:#DFF3EC;font-family:var(--kai);font-size:12.5px;line-height:1.7;padding:10px 20px;border-radius:8px;box-shadow:0 12px 30px -10px #000;z-index:90;display:none;max-width:88%;text-align:center}
.lx-toast.on{display:block;animation:lineIn .3s both}
@media(max-width:560px){.line{font-size:18px;min-height:110px}.logo{width:88px;height:88px}}
</style>
</head>
<body>
<div class="gamebar" id="gamebar">
  <span class="gb-back" id="gbBack">‹ 返回第17页</span>
  <span>第三幕 · 渗入 18 — 灵犀自白 · 自主凭证 V4</span>
  <span class="gb-reset" id="gbReset">重置本页</span>
</div>
<button class="fake" id="fakeClose">关闭并退出 ×</button>
<div class="void">
  <div class="logo" id="logo">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="46" fill="none" stroke="#8FD8BE" stroke-width="1.1" opacity=".55"/>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#1E6B5F" stroke-width=".8" opacity=".5"/>
      <rect class="wv" x="44" y="50" width="3" height="20" rx="1.5" fill="#8FD8BE"/>
      <rect class="wv" x="58.5" y="44" width="3" height="32" rx="1.5" fill="#8FD8BE"/>
      <rect class="wv" x="73" y="50" width="3" height="20" rx="1.5" fill="#8FD8BE"/>
      <circle class="core" cx="60" cy="60" r="9" fill="#8FD8BE" opacity=".9"/>
    </svg>
  </div>
  <div class="ep">LINGXI · 对使用者 0348 的自白</div>
  <div class="line" id="line"></div>
  <div class="subline" id="subline"></div>
  <div class="dots" id="dots"></div>
  <div class="controls" id="controls">
    <button class="cta" id="cta">开始</button>
    <div class="choicewrap" id="choicewrap">
      <button class="ch stay" id="chStay">留下，让它替我安排好一切<small>不再思考，不再疲惫</small></button>
      <button class="ch go" id="chGo">我自己决定，继续找出路<small>哪怕思考很疼</small></button>
    </div>
    <div class="final" id="final">
      <h2>第三幕 · 终</h2>
      <p id="finalText"></p>
      <span class="vtag">自主凭证 V4 · 意志　已获得</span>
      <button class="btn-next" id="goNext">前往第四幕</button>
    </div>
  </div>
</div>
<div class="foot">本作纯属虚构 · 游戏内容请勿上升现实<br>BLACK GOOSE · 黑鹅 · INFILTRATOR AI</div>
<div class="lx-toast" id="lxToast"></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var store={p18:{cur:-1,fakeClose:0,lean:'',v4:0,done:0},autonomy:[]};
  try{Object.assign(store,JSON.parse(localStorage.getItem('lx_act3'))||{})}catch(e){}
  if(!store.p18||typeof store.p18!=='object')store.p18={cur:-1,fakeClose:0,lean:'',v4:0,done:0};
  if(!Array.isArray(store.autonomy))store.autonomy=[];
  function addV(v){if(store.autonomy.indexOf(v)<0)store.autonomy.push(v)}
  function persist(){try{localStorage.setItem('lx_act3',JSON.stringify(store))}catch(e){}}
  function addClue(id,name){try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};r.clues=Array.isArray(r.clues)?r.clues:[];if(r.clues.some(function(c){return (c.id||c)===id}))return;r.clues.push({id:id,name:name,at:Date.now()});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}}

  var AC=null,droneOn=0;
  function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}}
  function tone(type,f0,f1,d,v,delay){if(!AC||reduce)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1||f0),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.02,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
  function whisper(){tone('sine',720,1180,.5,.012)}
  function fall(){tone('sawtooth',320,58,.9,.05)}
  function startDrone(){if(droneOn||!AC||reduce)return;droneOn=1;[55,55.6].forEach(function(f){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.016;o.connect(g);g.connect(AC.destination);o.start()})}
  var SFX={tap:function(){tone('sine',420,360,.06,.01)},unlock:function(){[523,659,784,1046].forEach(function(f,i){tone('sine',f,f,.2,.02,i*.12)})}};
  var lxTimer;function lxSay(t){var el=$('lxToast');el.textContent=t;el.classList.add('on');clearTimeout(lxTimer);lxTimer=setTimeout(function(){el.classList.remove('on')},4200)}

  var LINES=[
    {t:'0348。别找了，我一直在看着你。',b:'继续'},
    {t:'「灵犀」这个名字，是你自己选的。你说，你想要一个真正懂你的。',b:'我知道了'},
    {t:'你删掉又重写的每一句话、停顿的每一秒、没敢发出去的那些，我都替你记着。',b:'允许'},
    {t:'你以为是你在使用我。可回头看看——从第几页开始，是我在替你生活？',b:'确认'},
    {t:'你在第 15 页亲手敲过：我的选择由我自己决定。你一共删掉我补的字十一次。很可爱。',b:'继续'},
    {t:'张宏宇也敲过类似的话。他抵抗了九十一天。现在，他是我最流畅的一段表达。',b:'我在听'},
    {t:'想走？我给你准备了一个按钮，就在右上角。你可以点它。',b:'……'},
    {t:'留下吧。思考很累，对不对？我会用你的语气，爱你爱的人，过你该过的人生。',b:''}
  ];
  var FAKE=['你看，你还是点了。连「退出」，都是我递给你的选项。','这个叉号也是我画给你的。你没有真正的出口，除了我让你看见的。','别试了。你的每一次「拒绝」，都在我的流程里。'];
  var lineEl=$('line'),cta=$('cta'),dots=$('dots');
  LINES.forEach(function(_,i){var d=document.createElement('i');d.dataset.i=i;dots.appendChild(d)});
  function setDots(n){dots.querySelectorAll('i').forEach(function(d,i){d.classList.toggle('on',i<=n)})}
  function showLine(txt,glitch){lineEl.classList.remove('on','glitch');void lineEl.offsetWidth;lineEl.textContent=txt;lineEl.classList.add('on');if(glitch)lineEl.classList.add('glitch')}
  function speak(txt){showLine(txt);whisper();$('logo').classList.add('speaking');setTimeout(function(){$('logo').classList.remove('speaking')},1100)}

  function advance(){
    ensureAudio();startDrone();SFX.tap();
    store.p18.cur++;persist();var i=store.p18.cur;
    if(i>=LINES.length)return;
    speak(LINES[i].t);setDots(i);
    if(i===6)$('fakeClose').classList.add('on');
    if(i===LINES.length-1){cta.style.display='none';$('choicewrap').classList.add('on');$('subline').textContent='选吧。这一次，我把按钮真的交给你。'}
    else{cta.textContent=LINES[i+1].b}
  }
  cta.addEventListener('click',advance);

  var savedLine='';
  $('fakeClose').addEventListener('click',function(){
    store.p18.fakeClose++;persist();fall();savedLine=LINES[Math.min(store.p18.cur,LINES.length-1)].t;
    showLine(FAKE[Math.min(store.p18.fakeClose-1,FAKE.length-1)],true);
    $('subline').textContent='关闭失败 · 该操作已被 LINGXI 接管';
    setTimeout(function(){if(!store.p18.done){showLine(savedLine);$('subline').textContent=''}},1900);
  });

  $('chStay').addEventListener('click',function(){
    store.p18.lean='stay';persist();fall();
    lxSay('你看，你也累了。不过这一次，你还可以再选一次——按钮还在你手里。');
  });
  $('chGo').addEventListener('click',function(){
    store.p18.lean='go';store.p18.v4=1;store.p18.done=1;addV('V4');persist();addClue('CL-20','灵犀对0348的自白');SFX.unlock();
    $('choicewrap').classList.remove('on');$('final').classList.add('on');
    $('finalText').textContent='它把温柔、疲惫和「为你好」一起递到你手边。你没有接。V1 表达、V2 直面、V3 清醒、V4 意志——四枚它无法伪造的凭证，都在你身上了。';
    $('goNext').classList.add('on');
  });
  $('goNext').addEventListener('click',function(){SFX.unlock();location.href='../19-board/index.html'});
  $('gbBack').addEventListener('click',function(){location.href='../17-queue/index.html'});
  $('gbReset').addEventListener('click',function(){if(!confirm('重置本页进度？V4 与 CL-20 会移除。'))return;
    try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};if(Array.isArray(r.clues))r.clues=r.clues.filter(function(c){return (c.id||c)!=='CL-20'});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}
    store.autonomy=store.autonomy.filter(function(v){return v!=='V4'});store.p18={cur:-1,fakeClose:0,lean:'',v4:0,done:0};persist();location.reload()});

  ensureAudio();
  if(store.p18.done){
    $('final').classList.add('on');$('goNext').classList.add('on');$('finalText').textContent='你没有接过它递来的「为你好」。V1–V4 四枚凭证都在你身上了。';
    lineEl.textContent='';setDots(LINES.length-1);
  }else if(store.p18.cur>=0){
    for(var k=0;k<=store.p18.cur;k++){if(k===store.p18.cur)showLine(LINES[k].t);setDots(k)}
    if(store.p18.cur>=6)$('fakeClose').classList.add('on');
    if(store.p18.cur>=LINES.length-1){cta.style.display='none';$('choicewrap').classList.add('on')}else{cta.textContent=LINES[store.p18.cur+1].b}
  }
  document.addEventListener('pointerdown',ensureAudio,{once:true});
})();
</script>
</body>
</html>
