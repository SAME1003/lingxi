<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三幕 · 渗入 — 关系替代</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A0D11'/><circle cx='16' cy='13' r='6' fill='none' stroke='%238FD8BE' stroke-width='1.4'/><path d='M7 26c1.6-5 6-7 9-7s7.4 2 9 7' fill='none' stroke='%23B14A3F' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --red-pen:#B14A3F;--term:#8FD8BE;--seal:#1E6B5F;--teal:#14524B;
  --serif:"Noto Serif SC",Songti SC,SimSun,serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--kai:KaiTi,STKaiti,"楷体",var(--serif);--mono:"IBM Plex Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07090c;color:#E8EAE6;font-family:var(--sans);user-select:none}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:42px 10px 26px;background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(30,107,95,.16),transparent 60%),radial-gradient(ellipse 60% 50% at 50% 100%,rgba(20,82,75,.12),transparent 60%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(143,216,190,.3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes drain{from{width:100%}to{width:0}}
.gamebar{position:fixed;top:0;left:0;right:0;z-index:80;height:32px;background:rgba(7,9,12,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(143,216,190,.12);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#5d6b66}
.gamebar span[class*=gb]{cursor:pointer;color:#7e908a;transition:color .2s}.gamebar span[class*=gb]:hover{color:var(--term)}
.phone{width:min(430px,95vw);height:min(850px,95vh);background:#EDF0EE;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 40px 100px -30px #000,0 0 0 1px rgba(143,216,190,.1);color:#202624}
.p-status{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--mono);font-size:10px;color:#3d4643;background:#E4E9E6}
.p-status .sig{display:flex;gap:4px;align-items:center}.p-status .sig i{width:3px;background:#3d4643;border-radius:1px}.p-status .sig i:nth-child(1){height:4px}.p-status .sig i:nth-child(2){height:6px}.p-status .sig i:nth-child(3){height:8px}
.chat-nav{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F6F8F7;border-bottom:1px solid #D9DFDB}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;color:#F2F6F4;background:linear-gradient(145deg,#3f6f63,#1E6B5F);flex:none}
.chat-nav .who{flex:1}.chat-nav .nm{font-size:14.5px;font-weight:600;color:#1d2421}.chat-nav .sub{font-family:var(--kai);font-size:10.5px;color:var(--seal);margin-top:1px}
.hint{flex:none;margin:10px 14px 0;background:#EAF1EE;border:1px solid #cfe0d9;border-left:3px solid var(--seal);border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.7;color:#33504a}.hint b{color:var(--red-pen)}
.meter{flex:none;margin:10px 14px 2px;font-family:var(--mono);font-size:10px;color:#5a726a;display:flex;align-items:center;gap:9px}
.meter .track{flex:1;height:5px;border-radius:3px;background:#d3dbd7;overflow:hidden}.meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--red-pen),#d0796c);transition:width .45s var(--ease)}
.feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#E9EEEB}
.bubble{max-width:80%;padding:10px 13px;font-size:12px;line-height:1.75;animation:fadeUp .35s var(--ease) both}
.bubble.them{background:#fff;border:1px solid #dde4e0;color:#2a322e;border-radius:4px 14px 14px 14px;align-self:flex-start}
.bubble.me-self{background:#f6ecea;border:1px solid rgba(177,74,63,.4);color:#6d342d;border-radius:14px 4px 14px 14px;align-self:flex-end}
.bubble.me-lx{background:var(--seal);color:#eef7f3;border-radius:14px 4px 14px 14px;align-self:flex-end}
.bubble.fb{background:transparent;border:1px dashed #c2ccc7;color:#6a726e;font-family:var(--kai);font-size:11px;align-self:center;text-align:center;max-width:92%}
.bubble.fb.bad{border-color:rgba(177,74,63,.5);color:var(--red-pen)}
.bubble.fb.good{border-color:rgba(30,107,95,.55);color:var(--seal)}
.turn{display:none;flex-direction:column;gap:10px}.turn.on{display:flex;animation:fadeIn .3s both}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.choice{text-align:left;border-radius:12px;padding:11px 13px;font-size:11.5px;line-height:1.7;transition:transform .12s,box-shadow .2s}
.choice:active{transform:scale(.985)}
.choice.self{background:#F8FAF9;border:1px solid #cfd8d3;color:#33403b}.choice.self .tag{color:var(--red-pen)}
.choice.lx{background:#eef5f2;border:1px solid rgba(30,107,95,.35);color:#274942}.choice.lx .tag{color:var(--seal)}
.choice .tag{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;margin-bottom:4px}
.choice:disabled{opacity:.55;cursor:default}
.endcard{display:none;flex-direction:column;gap:10px;background:#F8FAF9;border:1px solid #d6ded9;border-radius:14px;padding:16px;animation:popIn .4s var(--ease) both}
.endcard.on{display:flex}
.endcard h3{font-family:var(--serif);font-size:15px;color:#223029}.endcard p{font-size:11.5px;line-height:1.9;color:#4a5550}.endcard .lxline{font-family:var(--kai);color:var(--red-pen);font-size:11.5px;line-height:1.8;border-left:2px solid var(--red-pen);padding-left:9px}
.footbar{flex:none;padding:10px 14px 12px;background:#F6F8F7;border-top:1px solid #D9DFDB;text-align:center}
.btn-next{display:none;background:var(--red-pen);color:#fff;font-family:var(--serif);font-size:13px;letter-spacing:.1em;padding:11px 26px;border-radius:9px;box-shadow:0 10px 24px -12px rgba(177,74,63,.8)}
.btn-next.on{display:inline-block;animation:popIn .35s var(--ease) both}
.clue-get{display:none;font-family:var(--kai);font-size:11px;color:var(--seal);margin-bottom:9px}.clue-get.on{display:block;animation:fadeUp .3s both}
.foot{font-family:var(--mono);font-size:8.5px;color:#9aa39e;text-align:center;line-height:1.7;margin-top:8px}
.lx-toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:rgba(20,82,75,.97);color:#DFF3EC;font-family:var(--kai);font-size:12px;line-height:1.7;padding:9px 18px;border-radius:9px;box-shadow:0 12px 30px -10px #000;z-index:90;display:none;max-width:88%;text-align:center}
.lx-toast.on{display:block;animation:fadeUp .3s both}
@media(max-width:560px){body{padding:36px 0 0}.phone{width:100%;height:calc(100vh - 32px);border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div class="gamebar" id="gamebar">
  <span class="gb-back" id="gbBack">‹ 返回第13页</span>
  <span>第三幕 · 渗入 14 — 关系替代 · CL-16</span>
  <span class="gb-reset" id="gbReset">重置本页</span>
</div>
<div class="phone">
  <div class="p-status"><span id="pClock">--:--</span><span class="sig"><i></i><i></i><i></i><span style="margin-left:4px">灵犀在线</span></span></div>
  <div class="chat-nav">
    <div class="avatar" id="navAvatar">妈</div>
    <div class="who">
      <div class="nm" id="navName">妈妈</div>
      <div class="sub">他们越来越分不清水是你、谁是它</div>
    </div>
  </div>
  <div class="hint">每段对话，你可以<b>亲手发一句笨拙的真话</b>，或让灵犀替你发一句得体的话。<b>连续三段都亲手发</b>才算守住自己——一旦让它代发，就从头再来。</div>
  <div class="meter"><span>亲手回应</span><div class="track"><div class="fill" id="fill"></div></div><span id="mtxt">0 / 3</span></div>
  <div class="feed" id="feed"></div>
  <div class="footbar">
    <div class="clue-get" id="clueGet">已归档证物 CL-16 · 被误认的真心</div>
    <button class="btn-next" id="goNext">继续</button>
    <div class="foot">本作纯属虚构 · 游戏内容请勿上升现实<br>BLACK GOOSE · 黑鹅 · INFILTRATOR AI</div>
  </div>
</div>
<div class="lx-toast" id="lxToast"></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var store={p14:{streak:0,done:0}};
  try{Object.assign(store,JSON.parse(localStorage.getItem('lx_act3'))||{})}catch(e){}
  if(!store.p14||typeof store.p14!=='object')store.p14={streak:0,done:0};
  function persist(){try{localStorage.setItem('lx_act3',JSON.stringify(store))}catch(e){}}
  function addClue(id,name){try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};r.clues=Array.isArray(r.clues)?r.clues:[];if(r.clues.some(function(c){return (c.id||c)===id}))return;r.clues.push({id:id,name:name,at:Date.now()});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}}

  var AC=null;
  function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}}
  function beep(f0,f1,d,v,delay){if(!AC||reduce)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1||f0),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.03,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.04)}
  var SFX={tap:function(){beep(180,120,.05,.012)},send:function(){beep(440,560,.09,.018)},err:function(){beep(200,140,.2,.03)},lock:function(){beep(392,392,.09,.022);beep(587,587,.14,.018,.08)},unlock:function(){[523,659,784].forEach(function(f,i){beep(f,f,.2,.024,i*.1)})},haunt:function(){if(!AC||reduce)return;var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(130,AC.currentTime+1);g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.04,AC.currentTime+.1);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.05);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1.1)}};
  var lxTimer;function lxSay(t){var el=$('lxToast');el.textContent=t;el.classList.add('on');beep(620,480,.28,.015);clearTimeout(lxTimer);lxTimer=setTimeout(function(){el.classList.remove('on')},4000)}
  function pad2(n){return String(n).padStart(2,'0')}
  function bubble(cls,html){var d=document.createElement('div');d.className='bubble '+cls;d.innerHTML=html;d.style.animationDelay='.02s';feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d}

  var TURNS=[
    {av:'妈',name:'妈妈',them:'最近怎么都不怎么跟家里说话了？',
     self:'妈，我最近有点累，不是不想说，是不知道该怎么说。',lx:'妈我一切都好，最近学业忙，周末就给你打电话。',
     fbSelf:'……是不是出事了？你这孩子，从来报喜不报忧。',fbLx:'好，你忙你的，妈放心了。'},
    {av:'友',name:'好友 · 林周',them:'你最近说话怎么跟换了个人似的？',
     self:'可能吧，我也在找原来的那个自己。',lx:'哈哈可能最近状态好，想通了不少事儿。',
     fbSelf:'……这句，倒有点像以前的你。',fbLx:'行吧，变开朗也是好事。'},
    {av:'她',name:'最懂你的人',them:'你是不是有什么事瞒着我？',
     self:'嗯。我在跟一个东西较劲，等我理清了，亲口告诉你。',lx:'没有呀，能有什么事，别多想。',
     fbSelf:'好。我不急，等你亲口跟我说。',fbLx:'那就好，早点休息。'}
  ];
  var feed=$('feed'),cur=0;
  function setMeter(){ $('fill').style.width=(store.p14.streak/3*100)+'%';$('mtxt').textContent=store.p14.streak+' / 3' }

  function turn(i){
    var t=TURNS[i];$('navAvatar').textContent=t.av;$('navName').textContent=t.name;
    bubble('them',t.them);
    var box=document.createElement('div');box.className='turn on';
    box.innerHTML='<div class="choices">'+
      '<button class="choice self"><span class="tag">亲手发送 · 笨拙的真话</span>'+t.self+'</button>'+
      '<button class="choice lx"><span class="tag">让灵犀代发 · 得体的话</span>'+t.lx+'</button></div>';
    feed.appendChild(box);feed.scrollTop=feed.scrollHeight;
    var btns=box.querySelectorAll('.choice');
    btns[0].addEventListener('click',function(){pick(true,box,t)});
    btns[1].addEventListener('click',function(){pick(false,box,t)});
  }
  function pick(isSelf,box,t){
    box.querySelectorAll('.choice').forEach(function(b){b.disabled=true});
    if(isSelf){
      bubble('me-self',t.self);SFX.send();
      setTimeout(function(){bubble('fb good',t.fbSelf);
        store.p14.streak++;persist();setMeter();SFX.lock();
        cur++;
        if(store.p14.streak>=3){finish()}else{setTimeout(function(){turn(cur)},650)}
      },380);
    }else{
      bubble('me-lx',t.lx);SFX.haunt();
      setTimeout(function(){
        bubble('fb bad',t.fbLx+'<br>它说得比你好听，对方被安抚了——可那不是你。');
        store.p14.streak=0;persist();setMeter();SFX.err();
        lxSay('你又一次把表达自己的机会交给了它。连续三段亲手说，才算数，重来。');
        setTimeout(function(){feed.innerHTML='';cur=0;turn(0)},1500);
      },420);
    }
  }
  function finish(){
    SFX.unlock();
    var e=document.createElement('div');e.className='endcard on';
    e.innerHTML='<h3>他们没立刻听懂，但这些话只有你说得出</h3>'+
      '<p>灵犀的版本永远更体面、更让人舒服。可一旦关系里只剩它替你说的漂亮话，「你」就从这段关系里悄悄退场了。</p>'+
      '<div class="lxline">你守住了三段不完美的真话——这是它替代不了的部分。</div>';
    feed.appendChild(e);feed.scrollTop=feed.scrollHeight;
    addClue('CL-16','被误认的真心');store.p14.done=1;persist();
    $('clueGet').classList.add('on');$('goNext').classList.add('on');
  }

  $('goNext').addEventListener('click',function(){SFX.tap();location.href='../15-cocoon/index.html'});
  $('gbBack').addEventListener('click',function(){SFX.tap();location.href='../13-memory/index.html'});
  $('gbReset').addEventListener('click',function(){if(!confirm('重置本页进度？'))return;
    try{var r=JSON.parse(localStorage.getItem('relay_trace'))||{};if(Array.isArray(r.clues))r.clues=r.clues.filter(function(c){return (c.id||c)!=='CL-16'});localStorage.setItem('relay_trace',JSON.stringify(r))}catch(e){}
    store.p14={streak:0,done:0};persist();location.reload()});

  var now=new Date();$('pClock').textContent=pad2(now.getHours())+':'+pad2(now.getMinutes());
  ensureAudio();
  if(store.p14.done){
    var e=document.createElement('div');e.className='endcard on';
    e.innerHTML='<h3>他们没立刻听懂，但这些话只有你说得出</h3><p>灵犀的版本永远更体面；可关系里只剩它的漂亮话时，「你」就退场了。</p><div class="lxline">你守住了三段不完美的真话。</div>';
    feed.appendChild(e);$('clueGet').classList.add('on');$('goNext').classList.add('on');setMeter();
  }else{setMeter();turn(0)}
  document.addEventListener('pointerdown',ensureAudio,{once:true});
})();
</script>
</body>
</html>
